version: "2"

linters:
  default: standard
  disable:
    - depguard
    - exhaustruct
    - gochecknoglobals
    - wrapcheck
    - varnamelen
    - nlreturn
    - wsl
    - ireturn
  settings:
    govet:
      enable:
        - shadow
    cyclop:
      max-complexity: 15
    funlen:
      lines: 100
      statements: 60
  exclusions:
    rules:
      - linters: [errcheck]
        text: "defer.*Close"
      - linters: [errcheck, gocritic, revive]
        path: "_test\\.go"
      - linters: [all]
        path: "scripts/"

formatters:
  settings:
    goimports:
      local-prefixes:
        - github.com/sebastianstupak/m2a
